services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: pgs
      POSTGRES_PASSWORD: pgs
      POSTGRES_DB: pgs_freight
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
  redis:
    image: redis:7
    ports:
      - "6379:6379"
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgresql://pgs:pgs@postgres:5432/pgs_freight
      REDIS_URL: redis://redis:6379
    ports:
      - "3000:3000"
    depends_on:
      - postgres
      - redis
  worker:
    build:
      context: .
      dockerfile: services/worker/Dockerfile
    environment:
      DATABASE_URL: postgresql://pgs:pgs@postgres:5432/pgs_freight
      REDIS_URL: redis://redis:6379
    depends_on:
      - postgres
      - redis
volumes:
  pgdata:
